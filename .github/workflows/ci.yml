name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-handling-guard:
    name: Data-handling guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACM "origin/${{ github.base_ref }}"...HEAD > changed_files.txt
          else
            git diff --name-only --diff-filter=ACM HEAD~1 HEAD > changed_files.txt || touch changed_files.txt
          fi
      - run: python3 .github/scripts/data_handling_guard.py changed_files.txt

  readings:
    name: Seam readings and evals
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: pip install pyyaml
      - run: python3 tools/validate_readings.py
      - run: python3 tools/validate_evals.py
